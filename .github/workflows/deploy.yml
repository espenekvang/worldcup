# GitHub Actions CI/CD Pipeline — Build and Deploy to Azure Container Apps
#
# Required GitHub repository secrets:
#   AZURE_CREDENTIALS      — Azure service principal JSON (from `az ad sp create-for-rbac --sdk-auth`)
#   ACR_NAME               — ACR resource name, e.g. acrworldcup (NOT the full login server URL)
#   RESOURCE_GROUP         — Azure resource group name, e.g. rg-worldcup
#   CONTAINER_APP_NAME     — Container App name, e.g. ca-worldcup
#   VITE_GOOGLE_CLIENT_ID  — Google OAuth client ID (baked into frontend JS bundle at build time)

name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Calculate version with GitVersion
        id: gitversion
        run: |
          version_json=$(dotnet dotnet-gitversion /output json)
          echo "$version_json"
          semver=$(echo "$version_json" | jq -r '.SemVer')
          major_minor_patch=$(echo "$version_json" | jq -r '.MajorMinorPatch')
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
          echo "major_minor_patch=$major_minor_patch" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          az acr build \
            --registry ${{ secrets.ACR_NAME }} \
            --image worldcup:${{ steps.gitversion.outputs.semver }} \
            --image worldcup:${{ steps.gitversion.outputs.semver }}-${SHORT_SHA} \
            --image worldcup:latest \
            --build-arg VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }} \
            --build-arg VITE_APP_VERSION=${{ steps.gitversion.outputs.semver }} \
            --build-arg VITE_SLACK_FEEDBACK_WEBHOOK=${{ secrets.VITE_SLACK_FEEDBACK_WEBHOOK }} \
            .

      - name: Deploy to Container App
        id: deploy
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          revision_json=$(az containerapp update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --container-name worldcup \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/worldcup:${{ steps.gitversion.outputs.semver }}-${SHORT_SHA})
          revision_name=$(echo "$revision_json" | jq -r '.properties.latestRevisionName')
          echo "revision_name=$revision_name" >> "$GITHUB_OUTPUT"
          echo "Deployed revision: $revision_name"

      - name: Wait for new revision to become healthy
        # az containerapp update returns success once Azure accepts the new revision
        # spec — NOT once the replicas are actually running. If the container crashes
        # on startup (e.g. segfault, missing config), traffic silently stays on the
        # previous healthy revision and the workflow looks green. Poll explicitly so
        # we surface startup failures here instead of discovering them in production.
        run: |
          revision="${{ steps.deploy.outputs.revision_name }}"
          rg="${{ secrets.RESOURCE_GROUP }}"
          app="${{ secrets.CONTAINER_APP_NAME }}"
          deadline=$(( $(date +%s) + 300 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state=$(az containerapp revision show -n "$app" -g "$rg" --revision "$revision" \
              --query "{health:properties.healthState, running:properties.runningState, details:properties.runningStateDetails}" -o json)
            health=$(echo "$state" | jq -r '.health')
            running=$(echo "$state" | jq -r '.running')
            details=$(echo "$state" | jq -r '.details // ""')
            echo "[$(date -u +%H:%M:%S)] revision=$revision health=$health running=$running ${details:+- $details}"
            if [ "$health" = "Healthy" ] && [ "$running" = "Running" -o "$running" = "RunningAtMaxScale" ]; then
              echo "Revision is healthy and serving traffic."
              exit 0
            fi
            if [ "$running" = "ActivationFailed" ] || [ "$running" = "Failed" ]; then
              echo "::error::Revision $revision failed to activate: $details"
              echo "--- Recent system logs for this container app ---"
              az containerapp logs show -n "$app" -g "$rg" --type system --tail 50 || true
              exit 1
            fi
            sleep 10
          done
          echo "::error::Revision $revision did not become healthy within 5 minutes."
          az containerapp logs show -n "$app" -g "$rg" --type system --tail 50 || true
          exit 1

      - name: Update ingress target port to app port
        run: |
          az containerapp ingress update \
            --name ${{ secrets.CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --target-port 8080
